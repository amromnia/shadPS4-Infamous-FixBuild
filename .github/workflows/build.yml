name: Windows Build

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Also run Windows C++ tests
        type: boolean
        default: false
        required: false

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

permissions:
  contents: read

jobs:
  test:
    name: Windows C++ tests
    runs-on: windows-2025-vs2026
    if: ${{ inputs.run_tests }}
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive
    - uses: lukka/get-cmake@latest
    - uses: egor-tensin/vs-shell@v2
      with:
        arch: x64
    - name: Configure tests
      run: cmake -B build -G Ninja -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_BUILD_TYPE=Debug -DENABLE_TESTS=ON
    - name: Create user data directory
      run: New-Item -ItemType Directory -Force "$env:APPDATA/shadPS4"
    - name: Build tests
      run: cmake --build build --parallel $env:NUMBER_OF_PROCESSORS
    - name: Run tests
      run: ctest --test-dir build --output-on-failure -E 'GcnTest'

  windows-sdl:
    runs-on: windows-2025-vs2026
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Get date and git hash
      id: vars
      shell: bash
      run: |
        echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
        echo "shorthash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
        echo "fullhash=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
    - name: Set up build tools
      uses: lukka/get-cmake@latest
    - name: Set up Visual Studio shell
      uses: egor-tensin/vs-shell@v2
      with:
        arch: x64

    - name: Cache CMake Configuration
      uses: actions/cache@v5
      env:
          cache-name: ${{ runner.os }}-sdl-ninja-cache-cmake-configuration
      with:
          path: |
            ${{github.workspace}}/build
          key: ${{ env.cache-name }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            ${{ env.cache-name }}-

    - name: Cache CMake Build
      uses: hendrikmuhs/ccache-action@v1.2.21
      env:
          cache-name: ${{ runner.os }}-sdl-cache-cmake-build
      with:
        append-timestamp: false
        key: ${{ env.cache-name }}-${{ hashFiles('**/CMakeLists.txt', 'cmake/**') }}

    - name: Print CPU Info
      run: bash -c "cat /proc/cpuinfo"

    - name: Configure CMake
      run: cmake --fresh -G Ninja -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=ON -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_EXE_LINKER_FLAGS=/MAP

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel $env:NUMBER_OF_PROCESSORS

    - name: Upload Windows SDL artifact
      uses: actions/upload-artifact@v7
      with:
        name: shadps4-win64-sdl-${{ steps.vars.outputs.date }}-${{ steps.vars.outputs.shorthash }}
        path: ${{github.workspace}}/build/shadPS4.exe

    # Names the functions in the profiler's samples, which are logged as offsets into the exe.
    - name: Upload Windows linker map
      uses: actions/upload-artifact@v7
      with:
        name: shadps4-win64-map-${{ steps.vars.outputs.date }}-${{ steps.vars.outputs.shorthash }}
        path: ${{github.workspace}}/build/shadPS4.map
        if-no-files-found: warn
